<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1a1c23">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Stationary Shooter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>⚔️ Stationary Shooter ⚔️</h1>
    <p class="credit">by ShiroAkari</p>

    <div class="container">
        <!-- Panel Profil Pemain -->
        <div class="panel">
            <h3>👤 Kartu Profil</h3>
            <div class="field">
                <label for="playerName">Nama Traveler:</label>
                <input type="text" id="playerName" value="Traveler" maxlength="20">
            </div>
            <div class="field">
                <label for="playerElement">Vision (Elemen Utama):</label>
                <select id="playerElement">
                    <option value="Pyro">🔥 Pyro (Api - Merah)</option>
                    <option value="Cryo">❄️ Cryo (Es - Biru Muda)</option>
                    <option value="Electro">⚡ Electro (Petir - Ungu)</option>
                </select>
            </div>
            <div class="field">
                <label>Skor Tertinggi Kamu:</label>
                <h2 id="highScoreText">0</h2>
            </div>
        </div>

        <!-- Canvas Tempat Game Dimainkan -->
        <div>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <p class="hint">Arahkan kursor &amp; klik untuk menembak Slime!</p>
        </div>

        <!-- Panel Leaderboard -->
        <div class="panel">
            <h3>🏆 Papan Peringkat</h3>
            <ol id="leaderboardList">
                <li>Belum ada skor...</li>
            </ol>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
